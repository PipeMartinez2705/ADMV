<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuestra Boda 💍</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS GENERALES Y FONDO --- */
        *, ::before, ::after { box-sizing: border-box; }
        
        body {
            font-family: "Quicksand", sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #fce4ec;
        }

        .bg-gif-fijo {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: url('https://github.com/PipeMartinez2705/ADMV/blob/main/Fondo%20Boda.jpeg?raw=true');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            filter: brightness(0.9);
        }

        /* --- SOBRE (ENVELOPE) --- */
        .envelope {
            --width: 300px;
            --height: 175px;
            position: relative;
            width: var(--width);
            height: var(--height);
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        @media (min-width: 720px) {
            .envelope { --width: 500px; --height: 290px; }
        }

        .envelope-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s ease-in-out;
            transform-style: preserve-3d;
        }

        .envelope.open .envelope-inner { transform: rotateY(180deg); }

        .envelope-front, .envelope-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .envelope-front {
            background: #E8C9C3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .envelope-front img.stamp {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 70px;
            height: 80px;
            border-radius: 4px;
            
        }

        .envelope-back {
            background: #E8C9C3;
            transform: rotateY(180deg);
        }

        .envelope-back::after {
            content: "";
            position: absolute;
            inset: 0;
            background: conic-gradient(transparent 60deg, #E8C9C3 60deg 120deg, #f7e3df 120deg 240deg, #E8C9C3 240deg 300deg, transparent 300deg);
            z-index: 2;
        }

        .top-fold {
            position: absolute;
            inset: 0;
            background: #E8C9C3;
            clip-path: polygon(0% 0%, 50% 55%, 100% 0%);
            z-index: 10;
            transform-origin: top;
            transition: transform 0.4s ease 0.4s;
        }

        .envelope.open .top-fold { transform: rotateX(180deg); z-index: 0; }

        .letter-preview {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 90%;
            height: 80%;
            background: white;
            transform: translateX(-50%);
            z-index: 1;
            padding: 20px;
            text-align: center;
            transition: transform 0.4s ease 0.6s;
        }

        .envelope.open .letter-preview { transform: translate(-50%, -40%); }

        /* --- MODAL MEJORADO --- */
        .modal-carta {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            padding: 20px;
        }

        .modal-carta.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-carta-content {
            width: 100%;
            max-width: 480px;
            max-height: calc(100vh - 80px);
            position: relative;
            box-sizing: border-box;
        }

        .modal-carta-content::-webkit-scrollbar { display: none; }

        /* Contenido interno que crece con el scroll: aquí va el borde rosado */
        .modal-carta-body {
            background: transparent;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-carta-body::-webkit-scrollbar { display: none; }

        /* GIF del modal (Nuevo) */
        .modal-footer-gif {
            width: 100%;
            max-width: 250px;
            display: block;
            margin: 20px auto 0;
            border-radius: 15px;
            opacity: 1;
        }

        .gift-hint {
            margin-top: 8px;
            margin-bottom: 8px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            font-weight: 700;
            color: #ad1457;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.75);
        }

        .modal-carta-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #E8C9C3;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .modal-carta-close:hover { transform: scale(1.1) rotate(90deg); }

        .letra-flotante-badge {
            display: inline-block;
            background: #ad1457;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            margin-bottom: 20px;
            animation: float 2s infinite alternate ease-in-out;
        }

        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* Ajustes responsivos para el modal en móviles */
        @media (max-width: 420px) {
            .modal-carta { padding: 12px; }
            .modal-carta-content {
                padding: 18px 14px;
                border: 4px solid #fff;
                max-width: 96vw;
                max-height: calc(100vh - 40px);
                border-radius: 16px;
            }
            .modal-carta-content::before { box-shadow: inset 0 0 0 3px rgba(244,143,177,0.95); }
            .modal-footer-gif { max-width: 200px; }
        }

        .texto-carta {
            font-size: 1.2rem;
            line-height: 1.6;
                color: #6b1aa9;
            text-align: center;
            margin-bottom: 20px;
                font-weight: 600;
        }

            .texto-carta .resaltado {
                font-weight: 800;
                color: #4a0b74;
                background: rgba(244,143,177,0.06);
                padding: 6px 8px;
                border-radius: 8px;
                display: inline-block;
            }

        .img-polaroid {
            width: 100%;
            max-width: 480px;
            max-height: calc(100vh - 100px);
            height: auto;
            background: transparent;
            padding: 0;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            border: none;
            border-radius: 14px;
            margin: 0;
            display: block;
            object-fit: contain;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            cursor: default;
        }

        .img-polaroid.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .modal-footer-gif.shake {
            animation: gentle-shake 1.8s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes gentle-shake {
            0% { transform: rotate(2deg) scale(1.1) translateX(0); }
            20% { transform: rotate(1deg) scale(1.1) translateX(-2px); }
            40% { transform: rotate(3deg) scale(1.1) translateX(2px); }
            60% { transform: rotate(1deg) scale(1.1) translateX(-2px); }
            80% { transform: rotate(3deg) scale(1.1) translateX(2px); }
            100% { transform: rotate(2deg) scale(1.1) translateX(0); }
        }

        /* --- MODAL EXTRA DE IMAGEN --- */
        .modal-extra {
            position: fixed;
            inset: 0;
            z-index: 4000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-extra.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-extra-content {
            position: relative;
            width: min(420px, 95vw);
            background: transparent;
            border-radius: 18px;
            padding: 18px 16px 16px;
            text-align: center;
            box-shadow: none;
        }

        .modal-extra-title {
            margin: 0 0 12px;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.6rem, 5vw, 2.1rem);
            color: #111;
            font-weight: 700;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.95);
            background: rgba(255, 255, 255, 0.75);
            border-radius: 999px;
            padding: 6px 14px;
            display: inline-block;
        }

        .modal-extra-img {
            width: 100%;
            max-height: 65vh;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            animation: modal-image-float 2.4s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes modal-image-float {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
            100% { transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .modal-extra-img {
                animation: none;
            }
        }

        .modal-extra-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: #E8C9C3;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        /* --- MODAL IMAGEN AMPLIADA --- */
        .modal-imagen-flotante {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        
        .modal-imagen-flotante img {
            max-width: 90%;
            max-height: 80%;
            border: 10px solid white;
            border-radius: 5px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="bg-gif-fijo"></div>

    <!-- Audio Oculto -->
    <audio id="audioCarta" loop>
        <source src="https://github.com/PipeMartinez2705/ADMV/raw/refs/heads/main/Christina%20Perri%20-%20A%20Thousand%20Years%20%5BOfficial%20Music%20Video%5D.mp3" type="audio/mpeg">
    </audio>

    <!-- Sobre -->
    <div class="envelope" id="envelope">
        <div class="envelope-inner">
            <div class="envelope-front">
                <img src="https://github.com/PipeMartinez2705/ADMV/blob/main/estampilla%20Boda.png?raw=true" class="stamp" alt="stamp">
                <div style="text-align: left; color: white;">
                    <p><b>Para:</b> Ti, Con cariño 💍</p>
                    <p><b>De:</b> Los novios ❤️</p>
                </div>
            </div>
            <div class="envelope-back">
                <div class="top-fold"></div>
                <div class="letter-preview">
                    <img src="https://img.freepik.com/vector-premium/pulgar-dedos-imprimir-marca-huella-dactilar-amor-corazon_53500-1839.jpg" style="width: 50px;" alt="">
                    <p style="color: #ad1457; font-weight: bold; font-size: 0.9rem;">Te invitamos a...😶‍🌫️</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de la Carta -->
    <div class="modal-carta" id="modalCarta">
        <div class="modal-carta-content">
            <button class="modal-carta-close" id="closeModalCarta">&times;</button>
            
            <div class="modal-carta-body">
                <img id="imgPrincipal" class="img-polaroid" src="https://github.com/PipeMartinez2705/ADMV/blob/main/Boda.jpeg?raw=true" alt="Nuestra boda">
            </div>
        </div>
    </div>

    <script>
        // Bloqueo de seguridad básico
        document.addEventListener('contextmenu', e => e.preventDefault());

        const envelope = document.getElementById('envelope');
        const modal = document.getElementById('modalCarta');
        const closeBtn = document.getElementById('closeModalCarta');
        const audio = document.getElementById('audioCarta');
        const imgPolaroid = document.getElementById('imgPrincipal');

        // Función para abrir la carta
        envelope.addEventListener('click', () => {
            const isOpening = !envelope.classList.contains('open');
            envelope.classList.toggle('open');

            if (isOpening) {
                if (audio.paused) {
                    audio.currentTime = 15; 
                    audio.play().catch(() => console.log("Se requiere interacción para iniciar audio"));
                }
                setTimeout(() => {
                    modal.classList.add('active');
                    setTimeout(() => {
                        imgPolaroid.classList.add('visible');
                    }, 500);
                }, 1200);
            }
        });

        // Cerrar modal principal
        function closeModal() {
            modal.classList.remove('active');
            imgPolaroid.classList.remove('visible');
            setTimeout(() => {
                envelope.classList.remove('open');
            }, 300);
        }

        closeBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });

        // Cerrar con Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
